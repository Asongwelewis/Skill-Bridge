---
# kubectl create secret generic matching-service-secret \
#   --from-literal=SUPABASE_URL=https://tulwescncreiuclmfafv.supabase.co \
#   --from-literal=SUPABASE_SECRET_KEY=your_secret_key_here

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-service
  namespace: default
  labels:
    app: matching-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: matching-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: matching-service
    spec:
      containers:
        - name: matching-service
          image: nahnahsylvestre/skillbridge-matching-service:latest
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: NODE_ENV
              value: "production"
            - name: KAFKA_BROKER
              value: "skillbridge-kafka:9092"
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: matching-service-secret
                  key: SUPABASE_URL
            - name: SUPABASE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: matching-service-secret
                  key: SUPABASE_SECRET_KEY
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: matching-service
  namespace: default
  labels:
    app: matching-service
spec:
  selector:
    app: matching-service
  ports:
    - protocol: TCP
      port: 3002
      targetPort: 3002
  type: ClusterIP