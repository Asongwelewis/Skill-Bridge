---
# ── Secret (create manually with: kubectl create secret generic user-service-secret) ──
# kubectl create secret generic user-service-secret \
#   --from-literal=SUPABASE_URL=https://tulwescncreiuclmfafv.supabase.co \
#   --from-literal=SUPABASE_SECRET_KEY=your_secret_key_here

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: default
  labels:
    app: user-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: user-service
        version: v1
    spec:
      containers:
        - name: user-service
          image: nahnahsylvestre/skillbridge-user-service:latest
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: "production"
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: user-service-secret
                  key: SUPABASE_URL
            - name: SUPABASE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: user-service-secret
                  key: SUPABASE_SECRET_KEY
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: default
  labels:
    app: user-service
spec:
  selector:
    app: user-service
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
  type: ClusterIP