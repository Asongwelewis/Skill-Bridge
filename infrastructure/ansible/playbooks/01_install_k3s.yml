---
- name: Install K3s Kubernetes
  hosts: skillbridge
  become: true
  vars:
    redis_password: "{{ lookup('env', 'REDIS_PASSWORD') }}"
  tasks:
    - name: Ensure Redis password is provided
      assert:
        that:
          - redis_password | length > 0
        fail_msg: Set REDIS_PASSWORD before running this playbook.

    - name: Install K3s
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s
    - name: Ensure kubeconfig directory exists
      file:
        path: /root/.kube
        state: directory
        mode: '0700'
    - name: Copy kubeconfig to root home
      copy:
        remote_src: true
        src: /etc/rancher/k3s/k3s.yaml
        dest: /root/.kube/config
        mode: '0600'
    - name: Install Helm
      shell: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm
    - name: Add bitnami repo
      shell: helm repo add bitnami https://charts.bitnami.com/bitnami && helm repo update
      changed_when: false
    - name: Install Redis (skip if exists)
      shell: >
        helm install skillbridge-redis bitnami/redis
        --set architecture=standalone
        --set auth.enabled=true
        --set auth.password={{ redis_password | quote }}
      register: redis_result
      failed_when: redis_result.rc != 0 and 'cannot re-use a name' not in redis_result.stderr and 'exists' not in redis_result.stderr
      no_log: true
    - name: Install Kafka (skip if exists)
      shell: helm install skillbridge-kafka bitnami/kafka --set kraft.enabled=true --set zookeeper.enabled=false
      register: kafka_result
      failed_when: kafka_result.rc != 0 and 'cannot re-use a name' not in kafka_result.stderr and 'exists' not in kafka_result.stderr
    - name: Install Elasticsearch (skip if exists)
      shell: >
        helm install skillbridge-elastic bitnami/elasticsearch
        --set master.replicaCount=1 --set data.replicaCount=1
        --set global.storageClass=local-path
        --set master.resources.requests.memory=1Gi --set master.resources.limits.memory=2Gi
      register: elastic_result
      failed_when: elastic_result.rc != 0 and 'cannot re-use a name' not in elastic_result.stderr and 'exists' not in elastic_result.stderr
